<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Encriptador</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Segoe UI", Arial, Helvetica, sans-serif;
    background: #0b1120;
    color: #e5e9f5;
    margin: 0;
    padding: 30px 15px;
  }
  h1 { text-align: center; margin: 0 0 22px; font-size: 26px; }
  .contenedor { max-width: 800px; margin: 0 auto; }

  /* Pestañas */
  .pestanas { display: flex; gap: 12px; margin-bottom: 20px; }
  .pestana {
    flex: 1;
    padding: 16px;
    font-size: 17px;
    font-weight: bold;
    border-radius: 10px;
    border: 2px solid #6b9bff;
    background: #0f172a;
    color: #6b9bff;
    cursor: pointer;
  }
  .pestana.activa { background: #6b9bff; color: #0b1120; }

  /* Panel */
  .panel {
    display: none;
    background: #18213a;
    border: 1px solid #2a3552;
    border-radius: 12px;
    padding: 24px;
  }
  .panel.visible { display: block; }
  label { display: block; font-size: 16px; margin: 0 0 10px; }
  label.segunda { margin-top: 22px; }
  textarea {
    width: 100%;
    min-height: 110px;
    padding: 14px;
    font-size: 16px;
    font-family: inherit;
    color: #e5e9f5;
    background: #0d1426;
    border: 1px solid #2a3552;
    border-radius: 10px;
    resize: vertical;
  }
  textarea:focus { outline: none; border-color: #6b9bff; }
  textarea::placeholder { color: #6b7590; }
  textarea[readonly] { min-height: 80px; background: #111a30; }

  .botones { display: flex; gap: 12px; margin-top: 18px; flex-wrap: wrap; }
  button.accion, button.secundario {
    padding: 14px 24px;
    font-size: 16px;
    font-weight: bold;
    border-radius: 10px;
    cursor: pointer;
  }
  button.accion { background: #6b9bff; color: #0b1120; border: 2px solid #6b9bff; }
  button.secundario { background: #0f172a; color: #e5e9f5; border: 2px solid #2a3552; }
  button:hover { filter: brightness(1.1); }

  .error { color: #ff7b7b; font-size: 14px; margin-top: 12px; min-height: 18px; }
  .ok { color: #6ee7a0; }

  .gato { display: flex; justify-content: center; margin-bottom: 8px; }
  .gato svg { width: 170px; height: auto; overflow: visible; }
  #gato g, #gato ellipse, #gato path { transform-box: fill-box; transform-origin: center; }
  #patas { transform: translateY(120px); transition: transform 0.35s ease; }
  .tapado #patas { transform: translateY(0); }
  .pecho { transition: opacity 0.2s; }
  .tapado .pecho { opacity: 0; }
  .ojo { transition: transform 0.25s ease; }
  .sorprendido .ojo { transform: scale(1.3); }
  .orejas { transition: transform 0.25s ease; }
  .sorprendido .orejas { transform: translateY(-5px); }
  .pupila-sorpresa, .boca-o { opacity: 0; transition: opacity 0.2s; }
  .pupila-normal, .boca-normal { transition: opacity 0.2s; }
  .sorprendido .pupila-sorpresa, .sorprendido .boca-o { opacity: 1; }
  .sorprendido .pupila-normal, .sorprendido .boca-normal { opacity: 0; }
</style>
</head>
<body>

<div class="gato">
  <svg id="gato" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-label="Gatito">
    <defs>
      <clipPath id="circulo"><circle cx="100" cy="100" r="96"/></clipPath>
    </defs>
    <circle cx="100" cy="100" r="96" fill="#ede7f6"/>
    <g clip-path="url(#circulo)">
      <!-- Cuerpo y mancha blanca del pecho -->
      <ellipse cx="100" cy="212" rx="72" ry="62" fill="#1b1b1b"/>
      <path class="pecho" d="M100 152 q-10 12 -16 26 q8 -4 9 4 q3 -6 7 0 q4 -6 7 0 q1 -8 9 -4 q-6 -14 -16 -26 z" fill="#fff"/>
      <!-- Orejas -->
      <g class="orejas">
        <polygon points="42,88 50,22 90,60" fill="#1b1b1b"/>
        <polygon points="158,88 150,22 110,60" fill="#1b1b1b"/>
        <polygon points="52,72 56,38 78,60" fill="#f4a7b9"/>
        <polygon points="148,72 144,38 122,60" fill="#f4a7b9"/>
      </g>
      <!-- Cabeza -->
      <ellipse cx="100" cy="105" rx="62" ry="52" fill="#1b1b1b"/>
      <!-- Ojos -->
      <g class="ojo">
        <ellipse cx="78" cy="100" rx="14" ry="15" fill="#d4e157"/>
        <g id="pupilaIzq">
          <ellipse class="pupila-normal" cx="78" cy="100" rx="4.5" ry="10" fill="#111"/>
          <g class="pupila-sorpresa">
            <circle cx="78" cy="100" r="9" fill="#111"/>
            <circle cx="81" cy="96" r="3" fill="#fff"/>
          </g>
        </g>
      </g>
      <g class="ojo">
        <ellipse cx="122" cy="100" rx="14" ry="15" fill="#d4e157"/>
        <g id="pupilaDer">
          <ellipse class="pupila-normal" cx="122" cy="100" rx="4.5" ry="10" fill="#111"/>
          <g class="pupila-sorpresa">
            <circle cx="122" cy="100" r="9" fill="#111"/>
            <circle cx="125" cy="96" r="3" fill="#fff"/>
          </g>
        </g>
      </g>
      <!-- Nariz y boca -->
      <polygon points="94,120 106,120 100,127" fill="#f4a7b9"/>
      <path class="boca-normal" d="M100 127 q-6 8 -13 3 M100 127 q6 8 13 3" stroke="#bbb" stroke-width="2" fill="none" stroke-linecap="round"/>
      <ellipse class="boca-o" cx="100" cy="137" rx="5" ry="7" fill="#f4a7b9" stroke="#bbb" stroke-width="1.5"/>
      <!-- Bigotes -->
      <path d="M68 122 h-38 M68 128 l-36 8 M132 122 h38 M132 128 l36 8" stroke="#ccc" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Patitas (suben a tapar los ojos) -->
      <g id="patas">
        <rect x="58" y="104" width="44" height="120" rx="14" fill="#1b1b1b" stroke="#3a3a3a" stroke-width="2"/>
        <rect x="98" y="104" width="44" height="120" rx="14" fill="#1b1b1b" stroke="#3a3a3a" stroke-width="2"/>
        <ellipse cx="78" cy="100" rx="21" ry="18" fill="#1b1b1b" stroke="#3a3a3a" stroke-width="2"/>
        <ellipse cx="122" cy="100" rx="21" ry="18" fill="#1b1b1b" stroke="#3a3a3a" stroke-width="2"/>
        <g fill="#f4a7b9">
          <ellipse cx="78" cy="104" rx="7" ry="5"/>
          <circle cx="68" cy="94" r="3"/><circle cx="75" cy="90" r="3"/>
          <circle cx="82" cy="90" r="3"/><circle cx="89" cy="94" r="3"/>
          <ellipse cx="122" cy="104" rx="7" ry="5"/>
          <circle cx="111" cy="94" r="3"/><circle cx="118" cy="90" r="3"/>
          <circle cx="125" cy="90" r="3"/><circle cx="132" cy="94" r="3"/>
        </g>
      </g>
    </g>
    <circle cx="100" cy="100" r="96" fill="none" stroke="#6b9bff" stroke-width="4"/>
  </svg>
</div>

<h1>Encriptador</h1>

<div class="contenedor">

  <div class="pestanas">
    <button class="pestana activa" id="pestanaEncriptar" onclick="mostrar('encriptar')">Encriptar</button>
    <button class="pestana" id="pestanaDesencriptar" onclick="mostrar('desencriptar')">Desencriptar</button>
  </div>

  <!-- ENCRIPTAR -->
  <div class="panel visible" id="panelEncriptar">
    <label for="textoEncriptar">Palabra</label>
    <textarea id="textoEncriptar" placeholder="Escribe aquí, por ejemplo: Bizcocho"></textarea>
    <div class="botones">
      <button class="accion" onclick="accionEncriptar()">Encriptar</button>
      <button class="secundario" onclick="limpiar('Encriptar')">Limpiar</button>
    </div>
    <div class="error" id="errorEncriptar"></div>

    <label class="segunda" for="resultadoEncriptar">Resultado</label>
    <textarea id="resultadoEncriptar" readonly></textarea>
    <div class="botones">
      <button class="secundario" onclick="copiar('resultadoEncriptar', 'mensajeEncriptar')">Copiar</button>
    </div>
    <div class="error" id="mensajeEncriptar"></div>
  </div>

  <!-- DESENCRIPTAR -->
  <div class="panel" id="panelDesencriptar">
    <label for="textoDesencriptar">Texto encriptado</label>
    <textarea id="textoDesencriptar" placeholder="Pega aquí, por ejemplo: qwewwuowrwruqqqwqqwuqqqwwuqqqqwu"></textarea>
    <div class="botones">
      <button class="accion" onclick="accionDesencriptar()">Desencriptar</button>
      <button class="secundario" onclick="limpiar('Desencriptar')">Limpiar</button>
    </div>
    <div class="error" id="errorDesencriptar"></div>

    <label class="segunda" for="resultadoDesencriptar">Resultado</label>
    <textarea id="resultadoDesencriptar" readonly></textarea>
    <div class="botones">
      <button class="secundario" onclick="copiar('resultadoDesencriptar', 'mensajeDesencriptar')">Copiar</button>
    </div>
    <div class="error" id="mensajeDesencriptar"></div>
  </div>

</div>

<script>
// ===== Lista de caracteres (64) =====
// Primero la clave "cAsoPerU14", luego el resto en orden normal
// (A-Z con Ñ, a-z con ñ, 0-9) sin repetir los que ya están en la clave.
const CLAVE = "cAsoPerU14";
const NORMAL = "ABCDEFGHIJKLMNÑOPQRSTUVWXYZ" +
               "abcdefghijklmnñopqrstuvwxyz" +
               "0123456789";

let caracteres = CLAVE;
for (const ch of NORMAL) {
  if (!caracteres.includes(ch)) caracteres += ch;
}
// caracteres[0] tiene la posición 1, caracteres[1] la posición 2, etc.

// ===== Tabla del paso 2 (número -> letra) =====
const DIGITO_A_LETRA = ["q", "w", "e", "r", "t", "y", "u", "i", "o", "p"];

// ===== ENCRIPTAR =====
function encriptar(texto) {
  if (texto.length === 0) {
    throw new Error("Escribe una palabra para encriptar.");
  }

  // Revisar caracteres no permitidos
  const invalidos = [];
  for (const ch of texto) {
    if (!caracteres.includes(ch) && !invalidos.includes(ch)) {
      invalidos.push(ch);
    }
  }
  if (invalidos.length > 0) {
    const lista = invalidos.map(c => c === " " ? "(espacio)" : '"' + c + '"').join(", ");
    throw new Error("Caracteres no permitidos: " + lista +
      ". Solo se aceptan letras (A-Z, a-z, incluida la ñ) y números (0-9).");
  }

  // Paso 1: posición -> posición x posición -> 4 cifras
  const bloques = [];
  for (const ch of texto) {
    const posicion = caracteres.indexOf(ch) + 1;
    const cuadrado = posicion * posicion;
    bloques.push(String(cuadrado).padStart(4, "0"));
  }
  const paso1 = bloques.join(" ");

  // Paso 2: cada dígito -> letra
  let paso2 = "";
  for (const d of bloques.join("")) {
    paso2 += DIGITO_A_LETRA[Number(d)];
  }

  return { paso1, paso2 };
}

// ===== DESENCRIPTAR =====
function desencriptar(texto) {
  texto = texto.trim();
  if (texto.length === 0) {
    throw new Error("Pega un texto encriptado para desencriptar.");
  }

  // Paso 2 inverso: letra -> dígito
  let digitos = "";
  const invalidos = [];
  for (const ch of texto) {
    const d = DIGITO_A_LETRA.indexOf(ch);
    if (d === -1) {
      if (!invalidos.includes(ch)) invalidos.push(ch);
    } else {
      digitos += d;
    }
  }
  if (invalidos.length > 0) {
    const lista = invalidos.map(c => c === " " ? "(espacio)" : '"' + c + '"').join(", ");
    throw new Error("Caracteres no válidos: " + lista +
      ". Un texto encriptado solo contiene las letras q w e r t y u i o p.");
  }

  if (digitos.length % 4 !== 0) {
    throw new Error("El texto está incompleto: su largo debe ser múltiplo de 4.");
  }

  // Paso 1 inverso: bloques de 4 -> raíz -> carácter
  const bloques = [];
  let resultado = "";
  for (let i = 0; i < digitos.length; i += 4) {
    const bloque = digitos.substring(i, i + 4);
    bloques.push(bloque);
    const numero = Number(bloque);
    const raiz = Math.round(Math.sqrt(numero));
    if (raiz * raiz !== numero || raiz < 1 || raiz > caracteres.length) {
      throw new Error("El bloque " + bloque + " no corresponde a ningún carácter. " +
        "Revisa que el texto esté bien copiado.");
    }
    resultado += caracteres[raiz - 1];
  }

  return { paso1: bloques.join(" "), resultado };
}
// ===== Navegación entre pestañas =====
function mostrar(seccion) {
  const enc = seccion === "encriptar";
  document.getElementById("panelEncriptar").classList.toggle("visible", enc);
  document.getElementById("panelDesencriptar").classList.toggle("visible", !enc);
  document.getElementById("pestanaEncriptar").classList.toggle("activa", enc);
  document.getElementById("pestanaDesencriptar").classList.toggle("activa", !enc);
  ponerEstado(null);
}

// ===== Botones =====
function ejecutar(nombre, funcion, campoResultado) {
  const entrada = document.getElementById("texto" + nombre);
  const salida = document.getElementById("resultado" + nombre);
  const error = document.getElementById("error" + nombre);
  document.getElementById("mensaje" + nombre).textContent = "";
  try {
    const r = funcion(entrada.value);
    salida.value = r[campoResultado];
    error.textContent = "";
    entrada.blur();
    ponerEstado("sorprendido");
  } catch (e) {
    salida.value = "";
    error.textContent = e.message;
  }
}
function accionEncriptar() { ejecutar("Encriptar", encriptar, "paso2"); }
function accionDesencriptar() { ejecutar("Desencriptar", desencriptar, "resultado"); }

function limpiar(nombre) {
  document.getElementById("texto" + nombre).value = "";
  document.getElementById("resultado" + nombre).value = "";
  document.getElementById("error" + nombre).textContent = "";
  document.getElementById("mensaje" + nombre).textContent = "";
  ponerEstado(null);
}

function copiar(idCampo, idMensaje) {
  const campo = document.getElementById(idCampo);
  const mensaje = document.getElementById(idMensaje);
  if (campo.value === "") {
    mensaje.className = "error";
    mensaje.textContent = "No hay nada que copiar todavía.";
    return;
  }
  const exito = () => {
    mensaje.className = "error ok";
    mensaje.textContent = "Copiado.";
  };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(campo.value).then(exito).catch(() => copiaAlternativa(campo, exito));
  } else {
    copiaAlternativa(campo, exito);
  }
}

function copiaAlternativa(campo, exito) {
  campo.select();
  document.execCommand("copy");
  exito();
}

// ===== Gatito =====
const gato = document.getElementById("gato");
const pupilas = [
  { el: document.getElementById("pupilaIzq"), x: 78, y: 100 },
  { el: document.getElementById("pupilaDer"), x: 122, y: 100 }
];

// Los ojos siguen al cursor
function mirar(px, py) {
  const caja = gato.getBoundingClientRect();
  const escala = caja.width / 200;
  for (const p of pupilas) {
    const ox = caja.left + p.x * escala;
    const oy = caja.top + p.y * escala;
    const ang = Math.atan2(py - oy, px - ox);
    const dist = Math.min(5, Math.hypot(px - ox, py - oy) / 20);
    p.el.setAttribute("transform",
      "translate(" + (Math.cos(ang) * dist) + " " + (Math.sin(ang) * dist) + ")");
  }
}
document.addEventListener("mousemove", e => mirar(e.clientX, e.clientY));
document.addEventListener("touchmove", e => mirar(e.touches[0].clientX, e.touches[0].clientY));

// Estados: normal, tapado (escribiendo) y sorprendido (resultado)
let temporizador = null;
function ponerEstado(estado) {
  clearTimeout(temporizador);
  gato.classList.remove("tapado", "sorprendido");
  if (estado) gato.classList.add(estado);
  if (estado === "sorprendido") {
    temporizador = setTimeout(() => ponerEstado(null), 2500);
  }
}
for (const id of ["textoEncriptar", "textoDesencriptar"]) {
  const caja = document.getElementById(id);
  caja.addEventListener("focus", () => ponerEstado("tapado"));
  caja.addEventListener("input", () => ponerEstado("tapado"));
  caja.addEventListener("blur", () => {
    if (!gato.classList.contains("sorprendido")) ponerEstado(null);
  });
}

// Enter ejecuta la acción (Shift + Enter no hace nada especial)
document.getElementById("textoEncriptar").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); accionEncriptar(); }
});
document.getElementById("textoDesencriptar").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); accionDesencriptar(); }
});
</script>

</body>
</html>
